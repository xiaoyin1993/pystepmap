[project]
name = "pystepmap-server"
version = "0.1.0"
description = "pystepmap 平台后端：项目存储、添加 / 重新分析 / 删除项目的流程、HTTP 接口、pystepmap serve"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pystepmap-core",
    "pystepkit",
    "fastapi",
    "uvicorn",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["httpx2"]

[tool.uv.sources]
pystepmap-core = { workspace = true }
pystepkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pystepmap_server"]
